  <!-- ══ HOME VIEW ══ -->
  <div class="view active" id="home">
    <section class="hero">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="Hero video.mp4" type="video/mp4">
      </video>
      <button class="hero-play-btn" id="heroPlayBtn" onclick="document.querySelector('.hero-video').play()">▶</button>
      <div class="hero-overlay"></div>
      <button class="hero-info-btn" onclick="openVisualizationModal()"><span style="font-size:1.2rem;margin-right:0.5rem;">ⓘ</span>About the visualization</button>
      <div class="hero-content">
        <h1 class="hero-statement">Learning. Building.<br>Discovering what's <span class="accent">possible</span>.</h1>
        <div class="hero-tagline">A scientist studying neurodegeneration, aging, and the biology behind transformative therapeutics</div>
      </div>
    </section>

    <!-- VISUALIZATION MODAL -->
    <div class="modal-overlay" id="visualizationModal">
      <div class="modal-box">
        <button class="modal-close-btn" onclick="closeVisualizationModal()">×</button>
        <div class="modal-title">About this visualization</div>
        <div class="modal-description">3D reconstruction of an Alzheimer's disease mouse brain showing amyloid plaques (blue), lipid droplets (red), and microglia (green/gold). Rendered from confocal microscopy images using Imaris during my PhD research at Purdue University.</div>
      </div>
    </div>

    <!-- ABOUT SECTION -->
    <section class="content-section">
      <div style="display:grid;grid-template-columns:400px 1fr;gap:4rem;align-items:start;">
        <div>
          <img src="images-web/Home page image 1.JPG" alt="About" style="width:100%;height:auto;border-radius:8px;">
        </div>
        <div>
          <p style="font-size:1.5rem;font-weight:600;margin-bottom:1.5rem;"><strong>Hi, I'm Jitika.</strong></p>

          <!-- SNIPPET always visible -->
          <p>I'm a neuroscientist, but that's probably the least interesting thing about my story.</p>
          <p style="margin-bottom:1rem;"></p>
          <p>My career hasn't been shaped by a carefully planned roadmap. Instead, it's been shaped by questions that refused to leave me alone.</p>
          <p style="margin-bottom:1rem;"></p>
          <p>The first one found me during my undergraduate years. I joined a research lab studying protein misfolding in Alzheimer's disease and became fascinated by how something as small as a protein folding incorrectly could have such profound consequences.</p>

          <!-- READ FURTHER BUTTON -->
          <div style="margin:1.75rem 0 0.5rem;">
            <button id="readMoreBtn" class="read-more-btn" onclick="toggleReadMore()">Read further ↓</button>
          </div>

          <!-- FULL TEXT hidden by default -->
          <div id="aboutFullText" style="display:none;">
            <p style="margin-bottom:1rem;"></p>
            <p>When I left that lab six months later, I didn't continue studying Alzheimer's. Instead, I spent the rest of my undergraduate years working on Newcastle disease virus for my bachelor's thesis.</p>
            <p style="margin-bottom:1rem;"></p>
            <p>Although those projects couldn't have been more different, they shaped me in two important ways. The first left me with a question I couldn't quite let go of. The second made me realize that what I loved wasn't a particular field of biology, but research itself.</p>

            <div class="quote-box"><p style="font-weight:600;"><strong>I loved asking questions, designing experiments, getting something wrong, thinking again, and slowly piecing together an answer that hadn't existed before.</strong></p></div>

            <p>When it came time to choose a master's lab, I could have continued working on viruses. I already knew the techniques, the field, and the people. Instead, I returned to the question that had stayed with me for almost two years. Not because I had a plan to become an Alzheimer's researcher, but because I was still curious.</p>

            <div class="quote-box"><p style="font-weight:600;"><strong>It took me years to realize that I wasn't returning to a topic. I was returning to a way of thinking.</strong></p></div>

            <p>Protein aggregation led me to lipid metabolism. Lipid metabolism led me to neuroimmune interactions. Those questions eventually expanded into human disease models, therapeutic development, and building better ways to study disease.</p>

            <div class="quote-box"><p style="font-weight:600;"><strong>People often see these as different projects. I don't. I think I just kept zooming out.</strong></p></div>

            <p>During my PhD, another realization emerged. The part of science I enjoyed most wasn't only discovering new biology. It was building the things that made discovery possible: experimental models that better capture disease, image analysis pipelines that extract more meaningful information, and collaborations that bring together people with completely different ways of thinking.</p>

            <div class="quote-box"><p style="font-weight:600;"><strong>Building has become the lens through which I approach science, and I realized that I'm not limited by the skills I have today. I'm limited only by the problems I care deeply enough to learn for.</strong></p></div>

            <p>If a question matters to me, I'll learn whatever it takes to answer it. Biology. Imaging. Computational methods. AI. The tools have changed throughout my career, but my approach hasn't.</p>
            <p style="margin-bottom:1rem;"></p>
            <p>Almost every meaningful opportunity I've had began because someone believed in me before I had fully earned it. An undergraduate advisor who trusted me with real responsibility. A professor who eventually replied to the persistent emails of an overly enthusiastic master's student. A former lab member who introduced me to the lab that would completely change the direction of my PhD. Friends who answered late-night phone calls when I had just moved halfway across the world. Parents who gave me the freedom to build a life around what genuinely excited me.</p>

            <div class="quote-box"><p style="font-weight:600;"><strong>Those experiences changed me just as much as the science did. They taught me that meaningful work is rarely the product of one person. It comes from people who challenge one another, trust one another, and build something together that none of them could have built alone. That's the kind of scientist, collaborator, and teammate I hope to become.</strong></p></div>

            <p>This website exists because a CV can only tell part of the story. It can tell you what I've done, but it can't tell you how I think, what kinds of questions excite me, or why I care so deeply about building.</p>

            <div class="quote-box"><p style="font-weight:600;"><strong>After all, every meaningful chapter of my own story began with a conversation.</strong></p></div>

            <h3 style="font-family:var(--serif);font-size:1.75rem;font-weight:700;margin-bottom:1rem;">How does altered lipid metabolism reshape immune responses in Alzheimer's disease?</h3>
            <p style="font-size:0.95rem;line-height:1.7;color:var(--text-dark);margin-bottom:1.5rem;">Alzheimer's disease is accompanied by profound changes in lipid metabolism, yet whether these changes actively drive disease or simply reflect it has remained unclear. To address this question, I developed complementary mouse and human iPSC-derived models, quantitative imaging approaches, and chemical biology tools to investigate how disrupted lipid metabolism contributes to neurodegeneration.</p>
            <p style="font-size:0.95rem;line-height:1.7;color:var(--text-dark);margin-bottom:1.5rem;">In my first project, I identified DGAT2 as a key regulator of lipid droplet accumulation in microglia. By comparing pharmacological inhibition with targeted protein degradation (PROTACs), we found that eliminating the protein, rather than inhibiting its enzymatic activity, restored microglial homeostasis and reduced Alzheimer's pathology in aged mouse models.</p>
            <p style="font-size:0.95rem;line-height:1.7;color:var(--text-dark);margin-bottom:2rem;">Building on these findings, I investigated how altered lipid metabolism reshapes adaptive immunity through lipid antigen presentation, uncovering a potential link between lipid dysregulation and neuroinflammation in Alzheimer's disease.</p>

      <div class="work-tab-content" id="publications-tab">
        <div class="publications-list">
          <div class="publication-item reveal">
            <div class="pub-header"><div class="pub-title">Amyloid-β induces lipid droplet-mediated microglial dysfunction via the enzyme DGAT2 in Alzheimer's disease</div><div class="pub-meta">Priya Prakash, Palak Manchanda, Evi Paouri, Kanchan Bisht, Kaushik Sharma, Jitika Rajpoot, et al. · Immunity · 2025</div></div>
            <div class="pub-actions"><a href="https://pubmed.ncbi.nlm.nih.gov/40393454/" target="_blank" class="pub-link">PubMed</a><button class="pub-link abstract-toggle" onclick="toggleAbstract(this)">Abstract Preview</button></div>
            <div class="pub-abstract-content" style="display:none;"><div class="pub-abstract">Microglial phagocytosis genes have been linked to increased risk for Alzheimer's disease (AD), but the mechanisms translating genetic association to cellular dysfunction remain unknown. Here, we showed that microglia formed lipid droplets (LDs) upon amyloid-β (Aβ) exposure and that LD loads increased with proximity to amyloid plaques in brains from individuals with AD and the 5xFAD mouse model. LD-laden microglia exhibited defects in Aβ phagocytosis, and unbiased lipidomic analyses identified a parallel decrease in free fatty acids (FFAs) and increase in triacylglycerols (TGs) as the key metabolic transition underlying LD formation. DGAT2 promoted microglial LD formation and was increased in mouse 5xFAD and human AD brains. Pharmacologically targeting DGAT2 improved microglial uptake of Aβ and reduced plaque load and neuronal damage in 5xFAD mice.</div></div>
          </div>
          <div class="publication-item reveal">
            <div class="pub-header"><div class="pub-title">Insights into cerebral amyloid angiopathy type 1 and type 2 from comparisons of the fibrillar assembly and stability of the Aβ40-Iowa and Aβ40-Dutch peptides</div><div class="pub-meta">Jitika Rajpoot, Elliot J Crooks, Brandon A Irizarry, Ashley Amundson, William E Van Nostrand, Steven O Smith · Biochemistry · 2022</div></div>
            <div class="pub-actions"><a href="https://pubmed.ncbi.nlm.nih.gov/35666749/" target="_blank" class="pub-link">PubMed</a><button class="pub-link abstract-toggle" onclick="toggleAbstract(this)">Abstract Preview</button></div>
            <div class="pub-abstract-content" style="display:none;"><div class="pub-abstract">Two distinct diseases are associated with the deposition of fibrillar amyloid-β peptides in the human brain in an age-dependent fashion. Here we investigate differences in the formation and structure of fibrils of the Dutch and Iowa mutant Aβ peptides to gain insights into their biochemical and physiological differences in the brain. We find that both Aβ40-Dutch and Aβ40-Iowa have strong propensities to form antiparallel β-hairpins in the first step of the fibrillization process, but with marked differences in ability to form elongated antiparallel structures and in protofibril/fibril stability.</div></div>
          </div>
          <div class="publication-item reveal">
            <div class="pub-header"><div class="pub-title">Aβ40 fibril assembly on human cerebral smooth muscle cells impairs cell viability</div><div class="pub-meta">Brandon Irizarry, Judianne Davis, Jitika Rajpoot, Xiaoyue Zhu, Feng Xu, Steven O Smith, William E Van Nostrand · Biochemistry · 2025</div></div>
            <div class="pub-actions"><a href="https://pubmed.ncbi.nlm.nih.gov/39763333/" target="_blank" class="pub-link">PubMed</a><button class="pub-link abstract-toggle" onclick="toggleAbstract(this)">Abstract Preview</button></div>
            <div class="pub-abstract-content" style="display:none;"><div class="pub-abstract">Cerebral vascular deposition of amyloid-β, known as cerebral amyloid angiopathy (CAA), is associated with intracerebral hemorrhaging and contributes to disease progression in Alzheimer's disease. Here we evaluate the effects of fibrillar Aβ peptides on the viability of primary-cultured human cerebral smooth muscle cells, which are the major site of amyloid deposition in cerebral blood vessel walls.</div></div>
          </div>
          <div class="publication-item reveal">
            <div class="pub-header"><div class="pub-title">Characterization of nucleocapsid and matrix proteins of Newcastle disease virus in yeast</div><div class="pub-meta">Sahaya Glingston, Jitika Rajpoot, Nayan Moni Deori, Rachayeeta Deb, Sachin Kumar, Shirisha Nagotu · 3 Biotech · 2021</div></div>
            <div class="pub-actions"><a href="https://pubmed.ncbi.nlm.nih.gov/33489683/" target="_blank" class="pub-link">PubMed</a><button class="pub-link abstract-toggle" onclick="toggleAbstract(this)">Abstract Preview</button></div>

  <!-- ══ EXPLORATIONS VIEW ══ -->
  <div class="view" id="what-drives">
    <section class="content-section">
      <div class="drives-content">
        <div style="margin-bottom:4rem;display:flex;justify-content:space-between;align-items:flex-start;gap:3rem;">
          <div style="flex:1;">
            <h2 style="font-family:var(--serif);font-size:2.5rem;font-weight:300;margin-bottom:1rem;position:relative;">Questions That<br>Keep Me Curious<span style="position:absolute;left:0;bottom:-0.5rem;width:60px;height:2px;background:var(--accent);"></span></h2>
            <p style="font-size:0.95rem;line-height:1.8;color:var(--text-dark);margin-top:1.5rem;">Science moves forward because someone keeps asking the next question. These are a few of the questions I find myself thinking about most often.</p>
          </div>
          <div style="width:200px;height:200px;background:var(--bg-light);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;">
            <img src="images-web/What drives me illustration 1.jpg" alt="What drives me" style="width:100%;height:100%;object-fit:cover;">
          </div>
        </div>
        <div>
          <div class="reveal" style="display:flex;gap:2rem;padding:2rem 0;border-bottom:1px solid var(--border);align-items:flex-start;">
            <div style="font-size:1rem;color:var(--accent);flex-shrink:0;margin-top:-0.35rem;">●</div>
            <div>
              <h3 style="font-family:var(--serif);font-size:1.4rem;font-weight:400;margin-bottom:0.5rem;">Why do patients with the same diagnosis respond so differently to the same therapy?</h3>
              <div style="font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:1rem;">Precision Medicine</div>
              <p style="font-size:0.95rem;line-height:1.7;color:var(--text-dark);">Disease labels often hide remarkable biological diversity. I'm fascinated by the challenge of identifying the molecular mechanisms that distinguish one patient from another, with the hope of developing therapies that are guided by biology rather than diagnosis alone.</p>
            </div>
          </div>
          <div class="reveal" style="display:flex;gap:2rem;padding:2rem 0;border-bottom:1px solid var(--border);align-items:flex-start;">
            <div style="font-size:1rem;color:var(--accent);flex-shrink:0;margin-top:-0.35rem;">●</div>
            <div>
              <h3 style="font-family:var(--serif);font-size:1.4rem;font-weight:400;margin-bottom:0.5rem;">How can we build experimental models that better reflect human brain aging and diseases?</h3>
              <div style="font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:1rem;">Human Disease Models</div>
              <p style="font-size:0.95rem;line-height:1.7;color:var(--text-dark);">Our ability to understand disease is fundamentally limited by the models we use to study it. I'm interested in developing human-relevant experimental systems that better capture the biology of aging and neurodegeneration.</p>
            </div>
          </div>
          <div class="reveal" style="display:flex;gap:2rem;padding:2rem 0;border-bottom:1px solid var(--border);align-items:flex-start;">
            <div style="font-size:1rem;color:var(--accent);flex-shrink:0;margin-top:-0.35rem;">●</div>
            <div>
              <h3 style="font-family:var(--serif);font-size:1.4rem;font-weight:400;margin-bottom:0.5rem;">Why do so many promising therapies fail despite targeting the "right" biology?</h3>
              <div style="font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:1rem;">Therapeutic Strategy</div>
              <p style="font-size:0.95rem;line-height:1.7;color:var(--text-dark);">Neurodegenerative diseases arise from complex, interconnected biological processes. I want to understand when, where, and how we should intervene, and whether combining complementary therapeutic strategies can lead to more durable and meaningful outcomes.</p>
            </div>
          </div>
          <div class="reveal" style="display:flex;gap:2rem;padding:2rem 0;border-bottom:1px solid var(--border);align-items:flex-start;">
            <div style="font-size:1rem;color:var(--accent);flex-shrink:0;margin-top:-0.35rem;">●</div>
            <div>
              <h3 style="font-family:var(--serif);font-size:1.4rem;font-weight:400;margin-bottom:0.5rem;">How can we combine human biology, experimental science, and AI to build better medicines?</h3>
              <div style="font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:1rem;">Technology &amp; Translation</div>
              <p style="font-size:0.95rem;line-height:1.7;color:var(--text-dark);">Building AI-based image analysis tools was one of the experiences that most changed the way I think about AI in science. It showed me that it's not just a way to automate analysis, but a powerful partner in discovery when thoughtfully integrated with experimental research.</p>
            </div>
          </div>
        </div>
      </div>

            <div class="outside-text">Outside the lab, I'm endlessly fascinated by people and the many ways we think. I enjoy reading psychology, philosophy, and evolution because they challenge how I understand human behavior and decision-making. One author who has shaped me deeply is Oliver Sacks. And I have one completely unapologetic literary loyalty: Harry Potter. I still think it's one of the greatest fictional worlds ever created, and I welcome quiz challenges at any time.</div>

            <div class="outside-text">One of the experiences that shaped me most was organizing Technothlon, an international science competition run by students at IIT Guwahati. As the representative for my hometown, I spent months visiting schools, meeting principals, and encouraging students to participate, eventually bringing more than 1,200 students to the competition. The following year, I became one of six Chief Organizers, overseeing registrations from nearly sixty cities across Northern India.</div>

<script>
// Hero video autoplay
function playHeroVideo() {
  const v = document.querySelector('.hero-video');
  const btn = document.getElementById('heroPlayBtn');
  if (!v) return;
  v.play().then(() => { if (btn) btn.classList.add('hidden'); }).catch(() => { if (btn) btn.classList.remove('hidden'); });
}
const heroVideo = document.querySelector('.hero-video');
if (heroVideo) heroVideo.addEventListener('play', () => { const b = document.getElementById('heroPlayBtn'); if (b) b.classList.add('hidden'); });
window.addEventListener('load', playHeroVideo);
if (document.readyState === 'complete' || document.readyState === 'interactive') playHeroVideo();

// Scroll reveal
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// READ MORE / READ LESS toggle
function toggleReadMore() {
  const full = document.getElementById('aboutFullText');
  const btn  = document.getElementById('readMoreBtn');
  if (full.style.display === 'none') {
    full.style.display = 'block';
    if (btn) btn.style.display = 'none';
  } else {
    full.style.display = 'none';
    if (btn) btn.style.display = 'inline';
    document.querySelector('.content-section').scrollIntoView({ behavior: 'smooth' });
  }
}

// View switching
function switchView(viewName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewName).classList.add('active');
  if (viewName === 'current-work') switchWorkTab('research');
  document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
  const map = { home: 'About me', education: 'Education', 'current-work': 'Scientific Journey', 'what-drives': 'Explorations', outside: 'Beyond the bench', contact: 'Contact' };
  document.querySelectorAll('.nav-tabs button').forEach(btn => { if (btn.textContent.trim() === map[viewName]) btn.classList.add('active'); });
  window.scrollTo(0, 0);
  setTimeout(() => { document.querySelectorAll('.reveal').forEach(el => observer.observe(el)); }, 100);
}

// Work tab switching
function switchWorkTab(tabName) {
  document.querySelectorAll('.work-tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(tabName + '-tab').classList.add('active');
  document.querySelectorAll('.work-tab-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent.toLowerCase() === tabName) btn.classList.add('active');
  });
  document.querySelectorAll('.work-tab-content.active .reveal').forEach(el => observer.observe(el));
}

// Abstract toggle
function toggleAbstract(btn) {
  const panel = btn.closest('.publication-item').querySelector('.pub-abstract-content');
  const vis = panel.style.display !== 'none';
  panel.style.display = vis ? 'none' : 'block';
  btn.textContent = vis ? 'Abstract Preview' : 'Hide Abstract';
}

// Gallery scroll
function scrollGallery(container, idx) {
  const scroll = container.querySelector('.gallery-scroll');
  scroll.scrollLeft = idx * 450;
  container.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

// Navigate to publication
function navigateToPublication(event, pubTitle) {
  event.stopPropagation();
  switchWorkTab('publications');
  setTimeout(() => {
    document.querySelectorAll('.publication-item').forEach(pub => {
      if (pub.querySelector('.pub-title').textContent.includes(pubTitle.substring(0, 30))) {
        const panel = pub.querySelector('.pub-abstract-content');
        const btn = pub.querySelector('.abstract-toggle');
        if (panel.style.display === 'none') { panel.style.display = 'block'; btn.textContent = 'Hide Abstract'; }
        pub.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  }, 100);
}

function goHome(e) { e.preventDefault(); switchView('home'); }

function openVisualizationModal() { document.getElementById('visualizationModal').classList.add('active'); }
function closeVisualizationModal() { document.getElementById('visualizationModal').classList.remove('active'); }
document.addEventListener('click', e => { if (e.target === document.getElementById('visualizationModal')) closeVisualizationModal(); });

const contactForm = document.querySelector('.contact-form');
if (contactForm) contactForm.addEventListener('submit', function() { setTimeout(() => this.reset(), 500); });
<\/script>
